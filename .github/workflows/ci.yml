name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres 16 for the integration tests, started before the steps run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskq
          POSTGRES_PASSWORD: taskq
          POSTGRES_DB: taskq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskq -d taskq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://taskq:taskq@localhost:5432/taskq_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...