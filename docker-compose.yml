services:
  db:                       # service name; you'll use it in `docker compose exec db ...`
    image: postgres:16            # which image and tag
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq123
      POSTGRES_DB: taskqdb
    ports:
      - "5433:5432"           # host:container
    volumes:
      - taskq_pgdata:/var/lib/postgresql/data             # volume name : path inside the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskqdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  taskq_pgdata:                      # declare the named volume here (an empty value is fine)